# PAC-5: AC-C1 (lossless aggregation, bit-identical, every ring pair) runs in
# CI and blocks merge on every commit.
name: ci
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies (no torch in CI — Module B tests skip)
        run: pip install numpy scipy pyyaml pytest hypothesis matplotlib psutil tqdm
      - name: Full test suite
        run: python -m pytest tests/ -q
      - name: AC-C1 gate (explicit)
        run: python -m pytest tests/test_lossless_aggregation.py -q
